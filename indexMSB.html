<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MSB Event - Professional Blurred Backdrop</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background: radial-gradient(circle, #ff4d00, #cc3d00);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        #main-wrapper {
            position: relative;
            width: 98vw;
            height: 95vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
        }

        .cell {
            position: relative;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            perspective: 1000px;
            will-change: transform, opacity;
        }

        .cell-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
            transform-style: preserve-3d;
        }

        .cell.active .cell-inner {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .face-front {
            background: #ff4d00;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            padding: 2px;
        }

        .face-back {
            background: #000;
            transform: rotateY(180deg);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .blurred-bg {
            position: absolute;
            inset: 0;
            background-image: var(--bg-url);
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.75);
            transform: scale(1.3);
            z-index: 1;
        }

        .main-img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* HÚT XOÁY MƯỢT */
        .cell.sucked {
            transition:
                transform 2.8s cubic-bezier(0.22,1,0.36,1),
                opacity 2s ease;
            transform:
                translate3d(0,0,-800px)
                scale(0.05)
                rotateZ(720deg);
            opacity: 0;
        }

        #final-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
        }

        #final-img {
            max-width: 80%;
            max-height: 80%;
            border: 6px solid #fff;
            box-shadow: 0 0 50px rgba(255,255,255,0.7);
            border-radius: 20px;
            background: #fff;
            transform: scale(0.2);
            transition: all 3s cubic-bezier(0.175,0.885,0.32,1.1);
        }

        #final-overlay.show {
            opacity: 1;
        }

        #final-overlay.show #final-img {
            transform: scale(1);
        }

        canvas#vortex {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 500;
        }
    </style>
</head>

<body>

<div id="main-wrapper">
    <canvas id="vortex"></canvas>
    <div id="grid" class="grid-container"></div>

    <div id="final-overlay">
        <img id="final-img"
             src="https://firebasestorage.googleapis.com/v0/b/checkin-69311.firebasestorage.app/o/final.jpg?alt=media">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot }
        from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyAdmwwhCZh3MS7vM03MiL_FTIluqQNmFxo",
        authDomain: "checkin-69311.firebaseapp.com",
        projectId: "checkin-69311",
        storageBucket: "checkin-69311.firebasestorage.app",
        messagingSenderId: "682738949510",
        appId: "1:682738949510:web:760eb6c7d591af6fb16007"
    });

    const db = getFirestore(app);
    const grid = document.getElementById('grid');
    const canvas = document.getElementById('vortex');
    const ctx = canvas.getContext('2d');

    const userCells = {};
    let hasTriggered = false;

    // Tạo 130 ô
    for (let i = 1; i <= 130; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = `
            <div class="cell-inner">
                <div class="face face-front user-name">Hạng mục ${i}</div>
                <div class="face face-back">
                    <div class="blurred-bg"></div>
                    <img class="main-img">
                </div>
            </div>`;
        grid.appendChild(cell);
        userCells[i] = cell;
    }

    /* ===== VORTEX PARTICLES (TỐI ƯU) ===== */
    let particles = [];

    function createParticles(x, y) {
        for (let i = 0; i < 5; i++) {
            particles.push({
                x, y,
                vx: (Math.random()-0.5)*4,
                vy: (Math.random()-0.5)*4,
                life: 1,
                decay: Math.random()*0.004 + 0.002,
                size: Math.random()*2 + 1,
                color: Math.random()>0.5 ? '#fff' : '#ffd700'
            });
        }
    }

    function animateVortex(centerX, centerY) {
        canvas.width = innerWidth;
        canvas.height = innerHeight;

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);

            for (let i = particles.length-1; i >= 0; i--) {
                const p = particles[i];
                const dx = centerX - p.x;
                const dy = centerY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy) || 1;

                const force = Math.min(0.08, dist / 1200);
                p.vx += (dx/dist)*force;
                p.vy += (dy/dist)*force;

                p.vx *= 0.96;
                p.vy *= 0.96;

                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                ctx.globalAlpha = Math.max(p.life,0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
                ctx.fill();

                if (p.life <= 0) particles.splice(i,1);
            }

            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }
        animate();
    }

    function runProEffect() {
        const centerX = innerWidth/2;
        const centerY = innerHeight/2;
        animateVortex(centerX, centerY);

        const cells = [...document.querySelectorAll('.cell')];
        cells.forEach((cell, i) => {
            setTimeout(() => {
                const r = cell.getBoundingClientRect();
                createParticles(r.left+r.width/2, r.top+r.height/2);
                cell.classList.add('sucked');
            }, i*22 + Math.random()*60);
        });

        setTimeout(() => {
            document.getElementById('final-overlay').classList.add('show');
            launchFireworks();
        }, 7500);
    }

    function launchFireworks() {
        const end = Date.now() + 25000;
        const timer = setInterval(() => {
            if (Date.now() > end) return clearInterval(timer);

            confetti({
                particleCount: 120,
                spread: 360,
                startVelocity: 45,
                origin: {x: Math.random(), y: Math.random()},
                zIndex: 10001
            });
        }, 180);
    }

    /* ===== FIREBASE ===== */
    onSnapshot(query(collection(db,"user"), orderBy("id")), snap => {
        let active = 0;

        snap.forEach(d => {
            const data = d.data();
            const cell = userCells[data.id];
            if (!cell) return;

            const img = cell.querySelector('.main-img');
            const bg = cell.querySelector('.blurred-bg');
            const name = cell.querySelector('.user-name');

            if (data.url_images && img.src !== data.url_images) {
                img.src = data.url_images;
                bg.style.setProperty('--bg-url', `url('${data.url_images}')`);
            }

            if (data.user_name) name.innerText = data.user_name;
            if (data.is_active) {
                cell.classList.add('active');
                active++;
            }
        });

        if (active >= 60 && !hasTriggered) {
            hasTriggered = true;
            setTimeout(runProEffect, 2000);
        }
    });
</script>
</body>
</html>
