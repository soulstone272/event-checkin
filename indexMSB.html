<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MSB Event - Professional Blurred Backdrop</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background: radial-gradient(circle, #ff4d00, #cc3d00); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
        }
        
        #main-wrapper { position: relative; width: 98vw; height: 95vh; }

        .counter { 
            position: absolute; 
            top: 10px; 
            left: 15px; 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: bold;
            z-index: 100; 
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: opacity 1s ease;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
            transition: all 2.5s ease-in-out;
        }

        .cell { 
            position: relative; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 4px; 
            perspective: 1000px; 
        }

        .cell-inner { 
            position: relative; 
            width: 100%; height: 100%; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
        }

        .cell.active .cell-inner { transform: rotateY(180deg); }

        .face { 
            position: absolute; 
            inset: 0; 
            backface-visibility: hidden; 
            border-radius: 4px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        .face-front { 
            background: #ff4d00; 
            color: #ffffff; 
            font-size: 10px; 
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 2px;
        }

        /* PHẦN XỬ LÝ CHUYÊN NGHIỆP: FACE BACK */
        .face-back { 
            background: #000; 
            transform: rotateY(180deg); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        /* Lớp nền mờ phía sau */
        .blurred-bg {
            position: absolute;
            inset: 0;
            background-image: var(--bg-url);
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.7);
            transform: scale(1.3); /* Phóng to nhẹ để mất viền trắng khi blur */
            z-index: 1;
        }

        /* Ảnh chính phía trước */
        .main-img { 
            position: relative;
            z-index: 2;
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* QUAN TRỌNG: Hiển thị đầy đủ ảnh không mất đầu */
        }

        .cell.active .face-back { 
            border: 1.5px solid #ffffff; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); 
        }

        /* Hiệu ứng hút vào lỗ đen */
        .cell.sucked {
            transition: all 2.5s cubic-bezier(0.5, 0, 0.5, 1);
            transform: scale(0) rotate(1440deg) translateZ(-1000px);
            opacity: 0;
        }

        #final-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
        }

        #final-img {
            max-width: 80%;
            max-height: 80%;
            border: 6px solid #ffffff;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            background: #ffffff;
            transform: scale(0.2);
            transition: all 3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        #final-overlay.show #final-img { transform: scale(1); }

        canvas#vortex {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 500;
        }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <canvas id="vortex"></canvas>
        <div id="grid" class="grid-container"></div>
        <div id="final-overlay">
            <img src="https://firebasestorage.googleapis.com/v0/b/checkin-69311.firebasestorage.app/o/final.jpg?alt=media&token=2fd6e867-06ac-4344-bdf0-9b5a2dc3b309" id="final-img">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdmwwhCZh3MS7vM03MiL_FTIluqQNmFxo",
            authDomain: "checkin-69311.firebaseapp.com",
            projectId: "checkin-69311",
            storageBucket: "checkin-69311.firebasestorage.app",
            messagingSenderId: "682738949510",
            appId: "1:682738949510:web:760eb6c7d591af6fb16007"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const grid = document.getElementById('grid');
        const counterEl = document.getElementById('checkin-counter');
        const finalOverlay = document.getElementById('final-overlay');
        const canvas = document.getElementById('vortex');
        const ctx = canvas.getContext('2d');
        const userCells = {};
        let hasTriggered = false;

        // Khởi tạo lưới 130 ô
        for (let i = 1; i <= 130; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerHTML = `
                <div class="cell-inner">
                    <div class="face face-front user-name">Hạng mục ${i}</div>
                    <div class="face face-back">
                        <div class="blurred-bg"></div>
                        <img src="" class="main-img">
                    </div>
                </div>
            `;
            grid.appendChild(cell);
            userCells[i] = cell;
        }

        // --- Logic hiệu ứng hạt Vortex (Giữ nguyên từ code cũ) ---
        let particles = [];
        function createParticles(x, y) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    decay: Math.random() * 0.003 + 0.002,
                    size: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? '#ffffff' : '#ffcc00'
                });
            }
        }

        function runProEffect() {
            counterEl.style.opacity = "0"; 
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const cells = Array.from(document.querySelectorAll('.cell'));
            
            cells.sort(() => Math.random() - 0.5).forEach((cell, index) => {
                setTimeout(() => {
                    const rect = cell.getBoundingClientRect();
                    createParticles(rect.left + rect.width/2, rect.top + rect.height/2);
                    cell.classList.add('sucked');
                }, index * 40); 
            });

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, i) => {
                    const dx = centerX - p.x;
                    const dy = centerY - p.y;
                    p.vx += dx / 300;
                    p.vy += dy / 300;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fill();
                    if(p.life <= 0) particles.splice(i, 1);
                });
                requestAnimationFrame(animate);
            }
            animate();

            setTimeout(() => {
                finalOverlay.classList.add('show');
                finalOverlay.style.opacity = "1";
                launchFinalFireworks();
            }, 7500);
        }

        function launchFinalFireworks() {
            const duration = 15000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = 50 * (timeLeft / duration);
                confetti({...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                confetti({...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }

        // Lắng nghe dữ liệu Firebase
        onSnapshot(query(collection(db, "user"), orderBy("id", "asc")), (snapshot) => {
            let activeCount = 0;
            snapshot.docs.forEach(doc => {
                const data = doc.data();
                const cell = userCells[data.id];
                if (cell) {
                    const img = cell.querySelector('.main-img');
                    const bg = cell.querySelector('.blurred-bg');
                    const nameEl = cell.querySelector('.user-name');

                    if (data.url_images && img.src !== data.url_images) {
                        img.src = data.url_images;
                        // Gán ảnh cho lớp nền mờ
                        bg.style.setProperty('--bg-url', `url('${data.url_images}')`);
                    }

                    if (data.user_name && nameEl.innerText !== data.user_name) {
                        nameEl.innerText = data.user_name;
                    }

                    if (data.is_active) {
                        cell.classList.add('active');
                        activeCount++;
                    }
                }
            });

            counterEl.innerText = `CHECK-IN: ${activeCount} / 130`;

            if (activeCount >= 30 && !hasTriggered) {
                hasTriggered = true;
                setTimeout(runProEffect, 2000);
            }
        });
    </script>
</body>
</html>
